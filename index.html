  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Space Grotesk', 'sans-serif'],
          },
          colors: {
            brand: {
              orange: '#FF5C1A',
              'orange-glow': 'rgba(255,92,26,0.15)',
              blue: '#2E86FF',
              'blue-glow': 'rgba(46,134,255,0.15)',
              dark: '#08090C',
              ink: '#08090C',
              surface: '#10131A',
              elevated: '#161B25',
              glass: 'rgba(255,255,255,0.04)',
              border: 'rgba(255,255,255,0.07)',
              apollo: '#FFB800',
              'apollo-glow': 'rgba(255,184,0,0.15)',
            }
          },
          animation: {
            'float': 'float 6s ease-in-out infinite',
            'fly-straight': 'flyStraight 2.5s ease-in-out forwards',
            'fade-in-text': 'fadeInText 2.5s ease-in-out forwards',
            'smoke-reveal': 'smokeReveal 2s ease-out forwards',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            'shimmer': 'shimmer 2s linear infinite',
            'wag': 'wag 0.5s ease-in-out infinite alternate',
            'slide-up': 'slideUp 0.5s cubic-bezier(0.16,1,0.3,1) forwards',
            'glow-pulse': 'glowPulse 2.5s ease-in-out infinite',
            'blur-in': 'blurIn 0.4s ease-out forwards',
            'scale-in': 'scaleIn 0.35s cubic-bezier(0.16,1,0.3,1) forwards',
          },
          keyframes: {
            float: {
              '0%, 100%': { transform: 'translateY(0)' },
              '50%': { transform: 'translateY(-10px)' },
            },
            flyStraight: {
              '0%': { transform: 'translateX(-120vw)', opacity: '0' },
              '10%': { opacity: '1' },
              '100%': { transform: 'translateX(120vw)', opacity: '1' }
            },
            fadeInText: {
              '0%': { opacity: '0', transform: 'translateX(-50px)' },
              '40%': { opacity: '0' },
              '60%': { opacity: '1', transform: 'translateX(0)' },
              '100%': { opacity: '0', transform: 'translateX(50px)' }
            },
            smokeReveal: {
              '0%': { opacity: '0', transform: 'scale(0.8) translateY(20px)', filter: 'blur(20px)' },
              '60%': { opacity: '0.8', filter: 'blur(5px)' },
              '100%': { opacity: '1', transform: 'scale(1) translateY(0)', filter: 'blur(0px)' }
            },
            shimmer: {
              '0%': { transform: 'translateX(-100%)' },
              '100%': { transform: 'translateX(100%)' }
            },
            wag: {
              '0%': { transform: 'rotate(-10deg)' },
              '100%': { transform: 'rotate(10deg)' }
            },
            slideUp: {
              '0%': { opacity: '0', transform: 'translateY(24px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' }
            },
            glowPulse: {
              '0%, 100%': { boxShadow: '0 0 20px rgba(255,92,26,0.3), 0 0 40px rgba(255,92,26,0.1)' },
              '50%': { boxShadow: '0 0 30px rgba(255,92,26,0.6), 0 0 60px rgba(255,92,26,0.2)' }
            },
            blurIn: {
              '0%': { opacity: '0', filter: 'blur(12px)', transform: 'scale(0.98)' },
              '100%': { opacity: '1', filter: 'blur(0px)', transform: 'scale(1)' }
            },
            scaleIn: {

  <style>
    :root {
      --ink: #08090C;
      --surface: #10131A;
      --elevated: #161B25;
      --accent: #FF5C1A;
      --accent-glow: rgba(255, 92, 26, 0.15);
      --sky: #2E86FF;
      --sky-glow: rgba(46, 134, 255, 0.15);
      --gold: #FFB800;
      --border: rgba(255, 255, 255, 0.07);
      --glass-bg: rgba(22, 27, 37, 0.75);
      --glass-border: rgba(255, 255, 255, 0.08);
    }

    * {
      -webkit-tap-highlight-color: transparent;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--ink);
      color: white;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overscroll-behavior: none;
    }

    h1, h2, h3, h4, h5, h6 {
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Hide scrollbar for Chrome, Safari and Opera */
    .hide-scrollbar::-webkit-scrollbar,
    .scrollbar-hide::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar,
    .scrollbar-hide {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    /* Custom Modern Scrollbar */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.08);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.15);
    }

    /* ─── Glass utilities ─── */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
    }

    .glass-light {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .glass-panel {
      background: rgba(21, 25, 33, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* ─── Glow utilities ─── */
    .glow-orange {
      box-shadow: 0 0 24px rgba(255, 92, 26, 0.35), 0 0 8px rgba(255, 92, 26, 0.2);
    }
    .glow-blue {
      box-shadow: 0 0 24px rgba(46, 134, 255, 0.35), 0 0 8px rgba(46, 134, 255, 0.2);
    }
    .glow-gold {
      box-shadow: 0 0 24px rgba(255, 184, 0, 0.4), 0 0 8px rgba(255, 184, 0, 0.2);
    }

    /* ─── Surface card ─── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
    }
    .card-elevated {
      background: var(--elevated);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 20px;
    }

    /* ─── Floating Pill Nav ─── */
    .pill-nav {
      background: rgba(10, 12, 16, 0.98);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 -4px 32px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
    }

    /* ─── Gradient text ─── */
    .gradient-text {
      background: linear-gradient(135deg, #FF5C1A, #FF8C5A);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .gradient-text-blue {
      background: linear-gradient(135deg, #2E86FF, #7BB8FF);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* ─── Shimmer skeleton ─── */
    .skeleton {
      position: relative;
      overflow: hidden;
      background: rgba(255,255,255,0.05);
    }
    .skeleton::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.06), transparent);
      animation: shimmer 1.8s linear infinite;
    }

    /* ─── Smooth active press — springy overshoot on release ─── */
    .press {
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      cursor: pointer;
      will-change: transform;
    }
    .press:active {
      transform: scale(0.95);
      transition-duration: 0.08s;
      transition-timing-function: cubic-bezier(0.16, 1, 0.3, 1);
    }
    /* Cards get a softer, deeper press than buttons */
    .press-card:active { transform: scale(0.98); }

    /* Tab content entrance — re-triggers each time the class is applied on switch */
    @keyframes tab-in {
      from { opacity: 0; transform: translateY(14px) scale(0.992); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }
    /* fill-mode `backwards`, never `both`: a transform that persists after the
       animation makes this element a containing block for `position: fixed`
       children, which anchors every modal inside the tab instead of the
       viewport (you'd have to scroll to find your own dialog). */
    .animate-tab-in { animation: tab-in 0.34s cubic-bezier(0.22, 1, 0.36, 1) backwards; }

    /* Nav icon pop when a tab becomes active */
    @keyframes tab-pop {
      0% { transform: scale(1); }
      45% { transform: scale(1.28) rotate(-4deg); }
      100% { transform: scale(1); }
    }
    .animate-tab-pop { animation: tab-pop 0.38s cubic-bezier(0.34, 1.56, 0.64, 1); }

    /* ─── Splash: taglines that fly through like departures board flips ─── */
    @keyframes phrase-fly {
      0%   { opacity: 0; transform: translateX(-58px) scale(0.94); filter: blur(7px); }
      20%  { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
      70%  { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
      100% { opacity: 0; transform: translateX(58px) scale(0.94); filter: blur(7px); }
    }
    /* The last line lands and stays — that's the one they should remember */
    @keyframes phrase-land {
      0%   { opacity: 0; transform: translateX(-58px) scale(0.94); filter: blur(7px); }
      55%  { opacity: 1; transform: translateX(0) scale(1.02); filter: blur(0); }
      100% { opacity: 1; transform: translateX(0) scale(1); filter: blur(0); }
    }
    .phrase-fly  { animation: phrase-fly 0.92s cubic-bezier(0.22, 1, 0.36, 1) both; }
    .phrase-land { animation: phrase-land 0.85s cubic-bezier(0.22, 1, 0.36, 1) both; }

    /* A hairline contrail the phrases ride along */
    @keyframes contrail {
      0%   { transform: scaleX(0); opacity: 0; }
      30%  { opacity: 1; }
      100% { transform: scaleX(1); opacity: 0.45; }
    }
    .animate-contrail { animation: contrail 2.1s cubic-bezier(0.22, 1, 0.36, 1) both; transform-origin: left center; }

    @media (prefers-reduced-motion: reduce) {
      .phrase-fly, .phrase-land, .animate-contrail { animation: none !important; }
      .phrase-fly { opacity: 0 !important; }
      .phrase-land { opacity: 1 !important; }
    }

    /* Apollo orb idle breathing — alive even when nobody's touching it */
    @keyframes orb-breathe {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(255,92,26,0.0); }
      50% { transform: scale(1.05); box-shadow: 0 0 22px 2px rgba(255,92,26,0.35); }
    }
    .animate-orb-breathe { animation: orb-breathe 3.6s ease-in-out infinite; border-radius: 9999px; }
    @media (prefers-reduced-motion: reduce) {
      .animate-tab-in, .animate-tab-pop, .animate-orb-breathe { animation: none !important; }
    }

    /* ─── Eliminate tap delay on all interactive elements ─── */
    button, a, [role="button"] {
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* ─── Bottom safe area ─── */
    .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
    .pt-safe-top { padding-top: env(safe-area-inset-top, 0px); }
    /* Header/floating elements must clear the notch / Dynamic Island / status bar */
    .pt-safe-header { padding-top: max(1rem, env(safe-area-inset-top, 16px)); }
    .top-safe { top: max(1rem, env(safe-area-inset-top, 16px)); }

    /* ─── Stagger animation delays ─── */
    .delay-100 { animation-delay: 0.1s; }
    .delay-150 { animation-delay: 0.15s; }
    .delay-200 { animation-delay: 0.2s; }
    .delay-300 { animation-delay: 0.3s; }
    .delay-400 { animation-delay: 0.4s; }
    .delay-500 { animation-delay: 0.5s; }

    /* ─── Multi-platform responsive ─── */
    
    /* Ensure full viewport height on iOS Safari */
    html, body, #root {
      height: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
    }

    /* Desktop: give the app a proper centered container feel */
    @media (min-width: 768px) {
      body {
        background: #050608;
      }
      #root {
        max-width: 100%;
        margin: 0 auto;
      }
    }

    /* Large desktop: constrain the app width for ultra-wide monitors */
    @media (min-width: 1280px) {
      #root {
        max-width: 1280px;
        border-left: 1px solid rgba(255,255,255,0.03);
        border-right: 1px solid rgba(255,255,255,0.03);
      }
    }

    /* Tablet landscape mode */
    @media (min-width: 768px) and (orientation: landscape) {
      .pill-nav {
        max-width: 600px;
        margin: 0 auto;
      }
    }

    /* iOS PWA standalone mode */
    @media all and (display-mode: standalone) {
      body {
        padding-top: env(safe-area-inset-top, 0px);
      }
    }

    /* Fix for iOS/Android address bar height changes */
    @supports (height: 100dvh) {
      html, body, #root {
        min-height: 100dvh;
      }
    }
  </style>
</head>
